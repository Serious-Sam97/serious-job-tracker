# Production: built images, nginx serves the app and proxies /api, Postgres not exposed.
# docker compose -f docker-compose.prod.yml --env-file .env up -d --build
name: job-tracker-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jobtracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      target: prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobtracker}
      PORT: 4000
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      target: prod
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${PROD_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata:
