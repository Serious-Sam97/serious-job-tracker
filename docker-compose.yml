# Local development: hot reload for api + web, Postgres exposed on 5433.
name: serious-job-tracker

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seriousjobtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seriousjobtracker}
      POSTGRES_DB: ${POSTGRES_DB:-seriousjobtracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      target: dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-seriousjobtracker}:${POSTGRES_PASSWORD:-seriousjobtracker}@db:5432/${POSTGRES_DB:-seriousjobtracker}
      PORT: 4000
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      - ./api:/app
      - /app/node_modules
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      target: dev
    environment:
      API_TARGET: http://api:4000
      WATCH_POLL: "true"
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  pgdata:
